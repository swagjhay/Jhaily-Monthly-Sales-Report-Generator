name: Trigger Monthly Reports

on:
  schedule:
    # Runs at 08:00 UTC on the 1st of every month.
    # GitHub Actions cron times are always UTC -- adjust the hour if you
    # want this to land at a specific local time instead.
    - cron: "0 8 1 * *"
  workflow_dispatch:
    # Lets you manually trigger this from the GitHub Actions tab too,
    # useful for testing without waiting for the 1st of the month.

jobs:
  trigger-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Call the /run-monthly-reports endpoint
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "X-Scheduler-Secret: ${{ secrets.SCHEDULER_SECRET }}" \
            "${{ secrets.JHAILY_APP_URL }}/run-monthly-reports")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Response: $body"
          if [ "$http_code" != "200" ]; then
            echo "Request failed with status $http_code"
            exit 1
          fi
